<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RSVP Viewer — Dowdle Trace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="nav.css" />
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <style>
    .viewer-wrap { max-width: 800px; margin: 0 auto; }

    /* ── LOGIN ── */
    .login-card {
      max-width: 380px;
      margin: 60px auto;
      background: var(--gray-50);
      border-radius: 14px;
      padding: 32px 28px;
      text-align: center;
    }
    .login-card h2 {
      font-family: var(--font-display);
      font-size: 22px;
      font-weight: 500;
      color: var(--gray-900);
      margin-bottom: 8px;
    }
    .login-card p {
      font-size: 14px;
      color: var(--gray-500);
      margin-bottom: 24px;
      line-height: 1.6;
    }
    .login-input {
      width: 100%;
      height: 42px;
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      padding: 0 14px;
      font-size: 15px;
      font-family: var(--font-body);
      background: var(--white);
      color: var(--gray-900);
      margin-bottom: 12px;
      transition: border-color 0.2s;
    }
    .login-input:focus { outline: none; border-color: var(--green-mid); }
    .login-btn {
      width: 100%;
      height: 42px;
      background: var(--green-mid);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 500;
      font-family: var(--font-body);
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .login-btn:hover { opacity: 0.88; }
    .login-error {
      font-size: 13px;
      color: #DC2626;
      margin-top: 10px;
      display: none;
    }

    /* ── VIEWER ── */
    .viewer-content { display: none; }

    .filter-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 24px;
      flex-wrap: wrap;
    }
    .filter-select {
      height: 38px;
      border: 1px solid var(--gray-200);
      border-radius: 8px;
      padding: 0 12px;
      font-size: 14px;
      font-family: var(--font-body);
      background: var(--white);
      color: var(--gray-900);
      flex: 1;
      min-width: 200px;
    }
    .filter-select:focus { outline: none; border-color: var(--green-mid); }

    .count-badge {
      font-size: 13px;
      font-weight: 500;
      color: var(--green-mid);
      background: var(--green-light);
      padding: 6px 14px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .print-btn {
      height: 38px;
      padding: 0 16px;
      background: var(--white);
      color: var(--green-mid);
      border: 1px solid var(--green-mid);
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font-body);
      cursor: pointer;
      transition: background 0.2s, color 0.2s;
      white-space: nowrap;
    }
    .print-btn:hover { background: var(--green-mid); color: white; }

    .rsvp-table {
      width: 100%;
      border-collapse: collapse;
      background: var(--gray-50);
      border-radius: 14px;
      overflow: hidden;
    }
    .rsvp-table thead {
      background: var(--green-dark);
    }
    .rsvp-table thead th {
      padding: 12px 16px;
      text-align: left;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: rgba(255,255,255,0.8);
    }
    .rsvp-table tbody tr {
      border-bottom: 1px solid var(--gray-200);
      transition: background 0.15s;
    }
    .rsvp-table tbody tr:last-child { border-bottom: none; }
    .rsvp-table tbody tr:hover { background: var(--green-light); }
    .rsvp-table tbody td {
      padding: 12px 16px;
      font-size: 14px;
      color: var(--gray-900);
    }
    .rsvp-table tbody td.muted { color: var(--gray-500); }

    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--gray-500);
      font-size: 14px;
      background: var(--gray-50);
      border-radius: 14px;
    }

    .loading-state {
      text-align: center;
      padding: 48px 24px;
      color: var(--gray-500);
      font-size: 14px;
    }

    /* ── PRINT ── */
    @media print {
      nav, .filter-row, .print-btn, footer { display: none !important; }
      .page-header { background: #2d4a1e !important; -webkit-print-color-adjust: exact; }
      .rsvp-table thead { background: #2d4a1e !important; -webkit-print-color-adjust: exact; }
      body { font-size: 12px; }
    }

    @media (max-width: 600px) {
      .filter-row { flex-direction: column; align-items: stretch; }
      .rsvp-table thead th, .rsvp-table tbody td { padding: 10px 12px; font-size: 13px; }
    }
  </style>
</head>
<body>

  <nav class="navbar">
    <div class="nav-left">
      <button class="nav-toggle" aria-label="Toggle navigation">☰</button>
      <a href="index.html" class="nav-logo">Dowdle Trace</a>
    </div>
    <ul class="nav-links">
      <li><a href="index.html">Home</a></li>
      <li><a href="announcements.html">Announcements</a></li>
      <li><a href="events.html" class="active">Events</a></li>
      <li><a href="community.html">Our community</a></li>
      <li><a href="documents.html">HOA documents</a></li>
    </ul>
  </nav>

  <div class="page-header" style="text-align:center;">
    <div class="page-header-eyebrow">Board &amp; hosts only</div>
    <h1>RSVP viewer</h1>
    <p style="margin:0 auto;">View and filter RSVPs by event.</p>
  </div>

  <section>
    <div class="viewer-wrap">

   
      <!-- VIEWER -->
      <div class="viewer-content" id="viewer-content" style="display:block;">

        <div class="filter-row">
          <select class="filter-select" id="event-filter" onchange="filterRsvps()">
            <option value="all">All events</option>
          </select>
          <div class="count-badge" id="count-badge">0 RSVPs</div>
          <button class="print-btn" onclick="window.print()">🖨 Print list</button>
        </div>

        <div id="table-container">
          <div class="loading-state">Loading RSVPs...</div>
        </div>

      </div>

    </div>
  </section>

  <footer>
    <p>Dowdle Trace Community &middot; Franklin, NC 28734</p>
    <a href="mailto:dowdletrace@gmail.com">dowdletrace@gmail.com</a>
  </footer>

  <script src="nav.js"></script>
  <script>
    // ── REPLACE WITH YOUR SUPABASE CREDENTIALS ──
    const SUPABASE_URL = 'https://btsjwkbvqqdnkvguqzcm.supabase.co';
    const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0c2p3a2J2cXFkbmt2Z3VxemNtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MjIwMzksImV4cCI6MjA5NDE5ODAzOX0.b9FqXDoQFiqEp2te8BXaC4WiKNdQ4JJzNpY625w3R5Q';
    const TABLE = 'rsvps';

    // ── SET YOUR VIEWER PASSWORD ──
    const VIEWER_PASSWORD = atob('ZG93ZGxlMjAyNiE='); // dowdle2026!

    let allRsvps = [];

    document.getElementById('password-input').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkPassword();
    });

    async function loadRsvps() {
      try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/${TABLE}?select=*&order=id.asc`, {
          credentials: 'omit',
          headers: {
            'apikey': SUPABASE_KEY,
            'Authorization': `Bearer ${SUPABASE_KEY}`,
            'Content-Type': 'application/json'
          }
        });
        allRsvps = await res.json();
        populateEventFilter();
        renderTable(allRsvps);
      } catch(e) {
        document.getElementById('table-container').innerHTML = '<div class="empty-state">Unable to load RSVPs — please refresh.</div>';
      }
    }

    function populateEventFilter() {
      const filter = document.getElementById('event-filter');
      const events = [...new Set(allRsvps.map(r => r.event))].sort();
      events.forEach(event => {
        const opt = document.createElement('option');
        opt.value = event;
        opt.textContent = event;
        filter.appendChild(opt);
      });
    }

    function filterRsvps() {
      const selected = document.getElementById('event-filter').value;
      const filtered = selected === 'all' ? allRsvps : allRsvps.filter(r => r.event === selected);
      renderTable(filtered);
    }

    function renderTable(data) {
      const container = document.getElementById('table-container');
      const badge = document.getElementById('count-badge');

      const totalGuests = data.reduce((sum, r) => sum + (parseInt(r.guests) || 1), 0);
      badge.textContent = `${data.length} RSVPs · ${totalGuests} guests`;

      if (data.length === 0) {
        container.innerHTML = '<div class="empty-state">No RSVPs found for this event yet.</div>';
        return;
      }

      let html = `
        <table class="rsvp-table">
          <thead>
            <tr>
              <th>Name</th>
              <th>Email</th>
              <th>Event</th>
              <th>Guests</th>
            </tr>
          </thead>
          <tbody>
      `;

      data.forEach(r => {
        html += `
          <tr>
            <td>${r.name}</td>
            <td class="muted">${r.email}</td>
            <td class="muted">${r.event}</td>
            <td>${r.guests}</td>
          </tr>
        `;
      });

      html += '</tbody></table>';
      container.innerHTML = html;
    }

    loadRsvps();
  </script>

</body>
</html>
