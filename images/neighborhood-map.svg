<!-- East Trace -->
<path d="M358,215 C368,238 375,265 378,295 C382,328 382,362 378,395 C374,428 368,460 362,490 C358,510 354,525 350,542" stroke="#60b8e8" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#rough)"/>
<path d="M358,215 C368,238 375,265 378,295 C382,328 382,362 378,395 C374,428 368,460 362,490 C358,510 354,525 350,542" stroke="#3898d0" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="20,10" opacity="0.5"/>
<circle cx="350" cy="542" r="8" fill="#60b8e8" filter="url(#rough)"/>

<!-- Circle Trce -->
<path d="M378,320 C410,312 445,314 475,325 C498,333 512,348 515,365" stroke="#b088e0" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#rough)"/>
<path d="M378,320 C410,312 445,314 475,325 C498,333 512,348 515,365" stroke="#9068c8" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="20,10" opacity="0.5"/>
