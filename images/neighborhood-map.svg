<!-- Southern Trce -->
<path d="M368,470 C395,460 428,458 460,465 C488,472 510,485 525,502" stroke="#68c870" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#rough)"/>
<path d="M368,470 C395,460 428,458 460,465 C488,472 510,485 525,502" stroke="#48a850" stroke-width="8" fill="none" stroke-linecap="round" stroke-dasharray="20,10" opacity="0.5"/>
<circle cx="525" cy="502" r="8" fill="#68c870" filter="url(#rough)"/>

<!-- Labels -->
<text x="492" y="105" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="500" fill="#b88a08" transform="rotate(-34,492,105)">Main Trce</text>
<text x="232" y="385" text-anchor="middle" font-family="Georgia, serif" font-size="15" font-weight="500" fill="#c04820" transform="rotate(-85,232,385)">Center Trce</text>
<text x="348" y="385" text-anchor="end" font-family="Georgia, serif" font-size="15" font-weight="500" fill="#1878b8" transform="rotate(-85,348,385)">East Trace</text>
<text x="455" y="322" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="500" fill="#6848b0" transform="rotate(-12,455,322)">Circle Trce</text>
<text x="452" y="452" text-anchor="middle" font-family="Georgia, serif" font-size="14" font-weight="500" fill="#287830" transform="rotate(-10,452,452)">Southern Trce</text>

<!-- Barn -->
<rect x="418" y="372" width="30" height="22" rx="3" fill="#c0522a" filter="url(#rough)"/>
<polygon points="412,372 454,372 441,357 422,357" fill="#a03818" filter="url(#rough)"/>
<rect x="429" y="380" width="9" height="14" rx="2" fill="#7a2808"/>
<text x="433" y="412" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#7a2808" font-weight="500">The Barn</text>

<!-- Entrance -->
<rect x="516" y="26" width="14" height="32" rx="3" fill="#3B6D11" filter="url(#rough)"/>
<rect x="536" y="26" width="14" height="32" rx="3" fill="#3B6D11" filter="url(#rough)"/>
<path d="M510,26 L556,26" stroke="#3B6D11" stroke-width="5" stroke-linecap="round"/>
<text x="533" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#2d4a1e" font-weight="500">Entrance</text>

<!-- Title -->
<rect x="28" y="28" width="235" height="60" rx="10" fill="#2d4a1e" opacity="0.92" filter="url(#rough)"/>
<text x="145" y="53" text-anchor="middle" font-family="Georgia, serif" font-size="18" font-weight="500" fill="#fdf6e3">Dowdle Trace</text>
<text x="145" y="74" text-anchor="middle" font-family="Georgia, serif" font-size="12" fill="#c8dba8">Community Map · Franklin, NC</text>

<!-- Legend -->
<rect x="28" y="555" width="340" height="68" rx="10" fill="#2d4a1e" opacity="0.88" filter="url(#rough)"/>
<text x="174" y="574" text-anchor="middle" font-family="Georgia, serif" font-size="12" font-weight="500" fill="#fdf6e3">Streets</text>
<rect x="38" y="582" width="28" height="9" rx="4" fill="#f5c842"/>
<text x="72" y="591" font-family="Georgia, serif" font-size="11" fill="#fdf6e3">Main Trce</text>
<rect x="38" y="598" width="28" height="9" rx="4" fill="#f08060"/>
<text x="72" y="607" font-family="Georgia, serif" font-size="11" fill="#fdf6e3">Center Trce</text>
<rect x="132" y="582" width="28" height="9" rx="4" fill="#60b8e8"/>
<text x="166" y="591" font-family="Georgia, serif" font-size="11" fill="#fdf6e3">East Trace</text>
<rect x="132" y="598" width="28" height="9" rx="4" fill="#b088e0"/>
<text x="166" y="607" font-family="Georgia, serif" font-size="11" fill="#fdf6e3">Circle Trce</text>
<rect x="232" y="582" width="28" height="9" rx="4" fill="#68c870"/>
<text x="266" y="591" font-family="Georgia, serif" font-size="11" fill="#fdf6e3">Southern Trce</text>
<rect x="232" y="598" width="14" height="10" rx="1" fill="#c0522a"/>
<text x="252" y="607" font-family="Georgia, serif" font-size="11" fill="#fdf6e3">  The Barn</text>

<!-- North arrow -->
<line x1="642" y1="575" x2="642" y2="550" stroke="#2d4a1e" stroke-width="2.5" stroke-linecap="round"/>
<polygon points="636,556 642,542 648,556" fill="#2d4a1e"/>
<text x="642" y="593" text-anchor="middle" font-family="Georgia, serif" font-size="13" fill="#2d4a1e" font-weight="500">N</text>

