<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 680 640" role="img">
<title>Dowdle Trace neighborhood map</title>
<desc>Crayon-style illustrated map of Dowdle Trace community showing all streets and landmarks</desc>

<defs>
  <filter id="rough" x="-5%" y="-5%" width="110%" height="110%">
    <feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4" result="noise"/>
    <feDisplacementMap in="SourceGraphic" in2="noise" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</defs>

<rect width="680" height="640" fill="#fdf6e3" rx="16"/>
<line x1="0" y1="80" x2="680" y2="80" stroke="#e8dcc8" stroke-width="0.5" opacity="0.5"/>
<line x1="0" y1="160" x2="680" y2="160" stroke="#e8dcc8" stroke-width="0.5" opacity="0.5"/>
<line x1="0" y1="240" x2="680" y2="240" stroke="#e8dcc8" stroke-width="0.5" opacity="0.5"/>
<line x1="0" y1="320" x2="680" y2="320" stroke="#e8dcc8" stroke-width="0.5" opacity="0.5"/>
<line x1="0" y1="400" x2="680" y2="400" stroke="#e8dcc8" stroke-width="0.5" opacity="0.5"/>
<line x1="0" y1="480" x2="680" y2="480" stroke="#e8dcc8" stroke-width="0.5" opacity="0.5"/>
<line x1="0" y1="560" x2="680" y2="560" stroke="#e8dcc8" stroke-width="0.5" opacity="0.5"/>

<ellipse cx="100" cy="150" rx="85" ry="55" fill="#a8d878" opacity="0.35" filter="url(#rough)"/>
<ellipse cx="580" cy="130" rx="70" ry="45" fill="#90c860" opacity="0.3" filter="url(#rough)"/>
<ellipse cx="120" cy="510" rx="90" ry="45" fill="#a8d878" opacity="0.3" filter="url(#rough)"/>
<ellipse cx="560" cy="500" rx="75" ry="45" fill="#90c860" opacity="0.28" filter="url(#rough)"/>

<rect x="60" y="128" width="5" height="18" rx="1" fill="#6b4226"/>
<circle cx="63" cy="120" r="14" fill="#3B8C20" filter="url(#rough)" opacity="0.8"/>
<rect x="92" y="112" width="5" height="16" rx="1" fill="#6b4226"/>
<circle cx="95" cy="105" r="11" fill="#4aaa28" filter="url(#rough)" opacity="0.75"/>
<rect x="598" y="102" width="5" height="18" rx="1" fill="#6b4226"/>
<circle cx="601" cy="95" r="13" fill="#4aaa28" filter="url(#rough)" opacity="0.75"/>
<rect x="72" y="500" width="5" height="18" rx="1" fill="#6b4226"/>
<circle cx="75" cy="492" r="14" fill="#3B8C20" filter="url(#rough)" opacity="0.75"/>
<rect x="570" y="492" width="5" height="16" rx="1" fill="#6b4226"/>
<circle cx="573" cy="485" r="12" fill="#3B8C20" filter="url(#rough)" opacity="0.75"/>

<!-- Main Trce -->
<path d="M535,40 C505,76 472,112 440,148 C415,176 388,198 358,215" stroke="#f5c842" stroke-width="20" fill="none" stroke-linecap="round" filter="url(#rough)"/>
<path d="M535,40 C505,76 472,112 440,148 C415,176 388,198 358,215" stroke="#e8b820" stroke-width="9" fill="none" stroke-linecap="round" stroke-dasharray="20,10" opacity="0.5"/>
<circle cx="358" cy="215" r="10" fill="#fdf6e3" stroke="#ccc" stroke-width="2"/>

<!-- Center Trce -->
<path d="M358,215 C335,232 308,252 282,275 C258,298 240,328 238,362 C236,395 245,428 252,465 C255,488 250,510 245,532" stroke="#f08060" stroke-width="18" fill="none" stroke-linecap="round" filter="url(#rough)"/>
